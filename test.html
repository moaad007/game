    <script>
        // Theme Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        const themeLabel = document.getElementById('themeLabel');
        const htmlElement = document.documentElement;

        themeToggle.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            themeLabel.textContent = isDark ? 'Light Mode' : 'Dark Mode';
        });

        // Countdown Timer Logic (60 seconds per turn)
        let timeLeft = 48;
        const totalTime = 60;
        const timerRing = document.querySelector('[data-timer-ring]');
        const timeLeftDisplay = document.querySelector('[data-time-left]');
        const circumference = 2 * Math.PI * 52; // r=52

        timerRing.style.strokeDasharray = circumference;

        function updateTimerDisplay() {
            timeLeftDisplay.textContent = `00:${String(timeLeft).padStart(2, '0')}`;
            const offset = circumference - (timeLeft / totalTime) * circumference;
            timerRing.style.strokeDashoffset = offset;
            
            if (timeLeft <= 10) {
                timerRing.style.stroke = '#ef4444'; // Red warning
            } else {
                timerRing.style.stroke = 'url(#timerGradient)';
            }
        }

        const timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft < 0) {
                timeLeft = 60; // Reset for demo loop
            }
            updateTimerDisplay();
        }, 1000);

        updateTimerDisplay();

        // Speakers Data
        const speakers = [
            { name: "شيماء", initials: "S", photo: "", level: "B1", achievements: "4", days: "3", flag: "https://flagcdn.com/w40/tr.png", bg: "linear-gradient(135deg, #2563eb, #7c3aed)" },
            { name: "Ikhlas", initials: "I", photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80", level: "B2", achievements: "6", days: "5", flag: "https://flagcdn.com/w40/tr.png", bg: "" }
        ];

        function switchSpeaker(index) {
            const speaker = speakers[index];
            document.querySelector('[data-student-name]').textContent = speaker.name;
            document.querySelector('[data-speaker-name-pill]').textContent = speaker.name;
            document.querySelector('[data-current-level]').textContent = speaker.level;
            document.querySelector('[data-current-achievements]').textContent = speaker.achievements;
            document.querySelector('[data-current-days]').textContent = speaker.days;

            const initialsEl = document.querySelector('[data-speaker-initials]');
            const photoEl = document.querySelector('[data-speaker-photo]');

            if (speaker.photo) {
                photoEl.src = speaker.photo;
                photoEl.classList.remove('hidden');
                initialsEl.classList.add('hidden');
            } else {
                photoEl.classList.add('hidden');
                initialsEl.classList.remove('hidden');
                initialsEl.textContent = speaker.initials;
                initialsEl.style.background = speaker.bg;
            }
        }

        // Topics rotation
        const topics = [
            { topic: "Tech Talk", question: "Did You Know You Dream Every Night?" },
            { topic: "Environment", question: "What Are Your Favorite Ways to Conserve Energy?" },
            { topic: "Travel & Culture", question: "If You Could Live in Any Country for One Year, Where?" },
            { topic: "Future AI", question: "How Will Artificial Intelligence Change Our Daily Jobs?" }
        ];

        let currentTopicIdx = 0;
        const topicTitleEl = document.querySelector('[data-topic-title]');
        const questionTextEl = document.querySelector('[data-question-text]');
        const nextTopicBtn = document.getElementById('nextTopicBtn');

        nextTopicBtn.addEventListener('click', () => {
            currentTopicIdx = (currentTopicIdx + 1) % topics.length;
            topicTitleEl.textContent = topics[currentTopicIdx].topic;
            questionTextEl.textContent = topics[currentTopicIdx].question;
        });

        // Audio Replay Simulation
        const replayAudioBtn = document.getElementById('replayAudioBtn');
        const audioIcon = document.querySelector('.pq-audio-icon');
        const audioWave = document.getElementById('audioWave');

        replayAudioBtn.addEventListener('click', () => {
            audioIcon.classList.add('hidden');
            audioWave.classList.remove('hidden');
            audioWave.classList.add('flex');
            
            setTimeout(() => {
                audioWave.classList.remove('flex');
                audioWave.classList.add('hidden');
                audioIcon.classList.remove('hidden');
            }, 3000);
        });

        // Record Speaking Simulation
        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const recordDot = document.getElementById('recordDot');
        let isRecording = false;

        recordBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                recordText.textContent = 'Listening... (Tap to stop)';
                recordBtn.classList.from = 'from-red-500';
                recordBtn.classList.to = 'to-pink-600';
                recordDot.classList.add('bg-amber-300');
            } else {
                recordText.textContent = 'Start Speaking';
                recordDot.classList.remove('bg-amber-300');
            }
        });

        // Modal Controls
        const participantsModal = document.getElementById('participantsModal');
        const showParticipantsBtn = document.getElementById('showParticipantsBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        showParticipantsBtn.addEventListener('click', () => {
            participantsModal.classList.remove('hidden');
            participantsModal.classList.add('flex');
        });

        function closeModal() {
            participantsModal.classList.add('hidden');
            participantsModal.classList.remove('flex');
        }

        closeModalBtn.addEventListener('click', closeModal);
        participantsModal.addEventListener('click', (e) => {
            if (e.target === participantsModal) closeModal();
        });
    </script>
</body>
</html>
